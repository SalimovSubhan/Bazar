name: bazar
description: "Product catalog mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.0

  # Localization
  easy_localization: ^3.0.7

  # Network
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  internet_connection_checker_plus: ^2.6.0

  # Local Storage
  drift: ^2.22.0
  drift_flutter: ^0.2.4

  # Dependency Injection
  get_it: ^8.0.2

  # Preferences
  shared_preferences: ^2.3.3

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
